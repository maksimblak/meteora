name: meteora-volume-bot

x-python-service: &python-service
  build:
    context: .
    dockerfile: Dockerfile
  environment: &python-environment
    APP_ENV: development
    DATABASE_URL: postgresql+asyncpg://meteora@postgres:5432/meteora

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: meteora
      POSTGRES_USER: meteora
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meteora -d meteora"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    <<: *python-service
    command: ["uv", "run", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *python-service
    command:
      - uv
      - run
      - uvicorn
      - src.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      <<: *python-environment
      WORKER_HEALTH_URL: http://worker:9100
      # Operator login (writes, kill switch, downgrade) from .env: set the value or its
      # *_FILE, not both. Unset -> the stack still starts and the panel says login is off.
      APP_OPERATOR_TOKEN: ${APP_OPERATOR_TOKEN:-}
      APP_OPERATOR_TOKEN_FILE: ${APP_OPERATOR_TOKEN_FILE:-}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:-}
      APP_SESSION_SECRET_FILE: ${APP_SESSION_SECRET_FILE:-}
      # APPROVAL wiring; empty by default, so the shadow stack starts without it and the
      # panel reports approvals as not configured. *_FILE are paths inside this container
      # (mount the files with a docker-compose.override.yml); values never go in here.
      TRADING_MODE: ${TRADING_MODE:-}
      EXECUTOR_URL: ${EXECUTOR_URL:-}
      EXECUTOR_INTERNAL_TOKEN_FILE: ${EXECUTOR_INTERNAL_TOKEN_FILE:-}
      EXECUTOR_APPROVAL_SECRET_FILE: ${EXECUTOR_APPROVAL_SECRET_FILE:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *python-service
    command: ["uv", "run", "python", "-m", "src.worker"]
    environment:
      <<: *python-environment
      # Health/metrics for the api on the internal compose network only (not published).
      WORKER_METRICS_HOST: 0.0.0.0
      # Live data (D07): the public Data API, narrowed by METEORA_UNIVERSE_FILTER
      # (empty = pools that traded in 24 h, "all" = the full sweep). SOLANA_RPC_URL adds
      # token risk and LB pair reads; without it token risk stays UNKNOWN.
      METEORA_DATA_API_BASE_URL: ${METEORA_DATA_API_BASE_URL:-https://dlmm.datapi.meteora.ag}
      METEORA_UNIVERSE_FILTER: ${METEORA_UNIVERSE_FILTER:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
      TRADING_MODE: ${TRADING_MODE:-}
      RULESET_VERSION: ${RULESET_VERSION:-}
      WORKER_UNIVERSE_INTERVAL_SECONDS: ${WORKER_UNIVERSE_INTERVAL_SECONDS:-}
      # Read-only quotes for candidates' depth (D07) from executor-quotes below, in every
      # mode. Set the internal token (or its *_FILE inside the container) for both; without
      # it there are no quotes and candidates carry DEPTH_UNAVAILABLE.
      EXECUTOR_QUOTES_URL: ${EXECUTOR_QUOTES_URL:-http://executor-quotes:3000}
      EXECUTOR_URL: ${EXECUTOR_URL:-}
      EXECUTOR_INTERNAL_TOKEN: ${EXECUTOR_INTERNAL_TOKEN:-}
      EXECUTOR_INTERNAL_TOKEN_FILE: ${EXECUTOR_INTERNAL_TOKEN_FILE:-}
    expose:
      - "9100"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The executor image pinned to SHADOW: it starts with the shadow stack, holds no wallet
  # by construction and serves only the read-only POST /v1/quotes (SOLANA_RPC_URL and the
  # internal token required). The money executor stays in the ``live`` profile.
  executor-quotes:
    build:
      context: .
      dockerfile: Dockerfile.executor
    environment:
      TRADING_MODE: SHADOW
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
      EXECUTOR_INTERNAL_TOKEN: ${EXECUTOR_INTERNAL_TOKEN:-}
      EXECUTOR_INTERNAL_TOKEN_FILE: ${EXECUTOR_INTERNAL_TOKEN_FILE:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/health/live')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10
    expose:
      - "3000"

  executor:
    profiles: ["live"]
    build:
      context: .
      dockerfile: Dockerfile.executor
    expose:
      - "3000"

  check:
    <<: *python-service
    profiles: ["test"]
    environment:
      <<: *python-environment
      TEST_DATABASE_URL: postgresql+asyncpg://meteora@postgres:5432/meteora
    command:
      - sh
      - -ec
      - |
        umask 077
        printf '%s' "$${DATABASE_URL}" > /tmp/database-url
        export DATABASE_URL_FILE=/tmp/database-url
        unset DATABASE_URL
        uv run alembic upgrade head
        uv run alembic upgrade head
        uv run ruff check src tests migrations
        uv run mypy src
        uv run pytest -q -p no:cacheprovider --basetemp /tmp/pytest
        npm run check --prefix executor
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
