name: meteora-volume-bot

# Every container log is rotated: at most 3 files of 10 MB each per service, so a week of
# SHADOW cannot fill the disk with logs (docker's default json-file grows without limit).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Everything the worker's pipeline policy reads (load_pipeline_policy). The api gets the same
# values, so its promotion evidence and /settings judge by the rules the worker applies.
x-policy-environment: &policy-environment
  RULESET_VERSION: ${RULESET_VERSION:-}
  RULESET_OVERRIDES_FILE: ${RULESET_OVERRIDES_FILE:-}
  WORKER_UNIVERSE_INTERVAL_SECONDS: ${WORKER_UNIVERSE_INTERVAL_SECONDS:-}
  GMGN_REQUIRED_FOR_LIVE: ${GMGN_REQUIRED_FOR_LIVE:-}
  # The executor's priority fee ceiling per transaction (the money executor below reads the
  # same variable). SHADOW books its own estimate on every entry, exit and sale - guide-v1
  # ``shadow_priority_fee_lamports`` - never more than this ceiling.
  PRIORITY_FEE_MAX_LAMPORTS: ${PRIORITY_FEE_MAX_LAMPORTS:-}

x-python-service: &python-service
  build:
    context: .
    dockerfile: Dockerfile
  logging: *logging
  environment: &python-environment
    APP_ENV: development
    DATABASE_URL: postgresql+asyncpg://meteora@postgres:5432/meteora

services:
  postgres:
    image: postgres:16-bookworm
    logging: *logging
    environment:
      POSTGRES_DB: meteora
      POSTGRES_USER: meteora
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meteora -d meteora"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    <<: *python-service
    command: ["uv", "run", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *python-service
    command:
      - uv
      - run
      - uvicorn
      - src.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      <<: [*python-environment, *policy-environment]
      WORKER_HEALTH_URL: http://worker:9100
      # Operator login (writes, kill switch, downgrade) from .env: set the value or its
      # *_FILE, not both. Unset -> the stack still starts and the panel says login is off.
      APP_OPERATOR_TOKEN: ${APP_OPERATOR_TOKEN:-}
      APP_OPERATOR_TOKEN_FILE: ${APP_OPERATOR_TOKEN_FILE:-}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:-}
      APP_SESSION_SECRET_FILE: ${APP_SESSION_SECRET_FILE:-}
      # APPROVAL wiring; empty by default, so the shadow stack starts without it and the
      # panel reports approvals as not configured. *_FILE are paths inside this container
      # (mount the files with a docker-compose.override.yml); values never go in here.
      TRADING_MODE: ${TRADING_MODE:-}
      EXECUTOR_URL: ${EXECUTOR_URL:-}
      EXECUTOR_INTERNAL_TOKEN_FILE: ${EXECUTOR_INTERNAL_TOKEN_FILE:-}
      EXECUTOR_APPROVAL_SECRET_FILE: ${EXECUTOR_APPROVAL_SECRET_FILE:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *python-service
    command: ["uv", "run", "python", "-m", "src.worker"]
    environment:
      <<: [*python-environment, *policy-environment]
      # Health/metrics for the api on the internal compose network only (not published).
      WORKER_METRICS_HOST: 0.0.0.0
      # Retention of telemetry history (snapshots, universe versions, feature vectors and
      # decisions without a plan); empty = 36 h. The audit trail is never purged.
      HISTORY_RETENTION_HOURS: ${HISTORY_RETENTION_HOURS:-}
      # Live data (D07): the public Data API, narrowed by METEORA_UNIVERSE_FILTER
      # (empty = pools that traded in 24 h, "all" = the full sweep). SOLANA_RPC_URL adds
      # token risk and LB pair reads; without it token risk stays UNKNOWN.
      METEORA_DATA_API_BASE_URL: ${METEORA_DATA_API_BASE_URL:-https://dlmm.datapi.meteora.ag}
      METEORA_UNIVERSE_FILTER: ${METEORA_UNIVERSE_FILTER:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
      TRADING_MODE: ${TRADING_MODE:-}
      # Read-only quotes for candidates' depth (D07) from executor-quotes below, in every
      # mode. Set the internal token (or its *_FILE inside the container) for both; without
      # it there are no quotes and candidates carry DEPTH_UNAVAILABLE.
      EXECUTOR_QUOTES_URL: ${EXECUTOR_QUOTES_URL:-http://executor-quotes:3000}
      EXECUTOR_URL: ${EXECUTOR_URL:-}
      EXECUTOR_INTERNAL_TOKEN: ${EXECUTOR_INTERNAL_TOKEN:-}
      EXECUTOR_INTERNAL_TOKEN_FILE: ${EXECUTOR_INTERNAL_TOKEN_FILE:-}
      # GMGN metrics of candidates (G18, G20). With GMGN_API_KEY (or GMGN_API_KEY_FILE, a path
      # inside this container) the worker reads the official GMGN OpenAPI (IPv4 only); the key
      # goes to this service alone. Without a key, the ``gmgn`` service below: with
      # ``--profile gmgn`` set GMGN_URL=http://gmgn:8080. Neither = not asked, decisions as
      # before. LIVE stays closed without fresh GMGN data until GMGN_REQUIRED_FOR_LIVE=false.
      GMGN_API_KEY: ${GMGN_API_KEY:-}
      GMGN_API_KEY_FILE: ${GMGN_API_KEY_FILE:-}
      GMGN_API_URL: ${GMGN_API_URL:-}
      GMGN_API_PLAN: ${GMGN_API_PLAN:-}
      GMGN_API_CACHE_SECONDS: ${GMGN_API_CACHE_SECONDS:-}
      GMGN_URL: ${GMGN_URL:-}
      GMGN_TIMEOUT_SECONDS: ${GMGN_TIMEOUT_SECONDS:-}
      GMGN_STALE_AFTER_SECONDS: ${GMGN_STALE_AFTER_SECONDS:-}
      # Open positions reread their pool from the Data API this often (empty = 30 s).
      WORKER_POSITION_SNAPSHOT_SECONDS: ${WORKER_POSITION_SNAPSHOT_SECONDS:-}
      # The sale of the base token an exit returned (G22); empty = the defaults.
      SWAP_AFTER_EXIT: ${SWAP_AFTER_EXIT:-}
      SWAP_MAX_PRICE_IMPACT_BPS: ${SWAP_MAX_PRICE_IMPACT_BPS:-}
      SWAP_SLIPPAGE_BPS: ${SWAP_SLIPPAGE_BPS:-}
      SWAP_AFTER_EXIT_MAX_SPLITS: ${SWAP_AFTER_EXIT_MAX_SPLITS:-}
      SWAP_AFTER_EXIT_ATTEMPTS: ${SWAP_AFTER_EXIT_ATTEMPTS:-}
      SWAP_SETTLEMENT_TIMEOUT_SECONDS: ${SWAP_SETTLEMENT_TIMEOUT_SECONDS:-}
    expose:
      - "9100"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The executor image pinned to SHADOW: it starts with the shadow stack, holds no wallet
  # by construction and serves only the read-only POST /v1/quotes (SOLANA_RPC_URL and the
  # internal token required). The money executor stays in the ``live`` profile.
  executor-quotes:
    build:
      context: .
      dockerfile: Dockerfile.executor
    logging: *logging
    environment:
      TRADING_MODE: SHADOW
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
      EXECUTOR_INTERNAL_TOKEN: ${EXECUTOR_INTERNAL_TOKEN:-}
      EXECUTOR_INTERNAL_TOKEN_FILE: ${EXECUTOR_INTERNAL_TOKEN_FILE:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/health/live')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10
    expose:
      - "3000"

  # GMGN metrics (G18, spec 6.7): the public token page in the official Playwright Chromium
  # with its defaults, as a plain visitor; no account, cookies, captcha solving or stealth.
  # Off by default (profile ``gmgn``); reachable on the compose network only.
  gmgn:
    profiles: ["gmgn"]
    build:
      context: .
      dockerfile: Dockerfile.gmgn
      target: runtime
    logging: *logging
    init: true
    shm_size: "1gb"
    environment:
      GMGN_PAGE_TIMEOUT_SECONDS: ${GMGN_PAGE_TIMEOUT_SECONDS:-}
      GMGN_CACHE_TTL_SECONDS: ${GMGN_CACHE_TTL_SECONDS:-}
      GMGN_MAX_PAGES: ${GMGN_MAX_PAGES:-}
      GMGN_BREAKER_COOLDOWN_SECONDS: ${GMGN_BREAKER_COOLDOWN_SECONDS:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 10
    expose:
      - "8080"

  executor:
    profiles: ["live"]
    build:
      context: .
      dockerfile: Dockerfile.executor
    logging: *logging
    environment:
      # Priority fee of every transaction (No 49); empty = the defaults: percentile 75 of
      # the pool's recent fees, at least 1000 micro-lamports a CU, at most 0.015 SOL.
      PRIORITY_FEE_MAX_LAMPORTS: ${PRIORITY_FEE_MAX_LAMPORTS:-}
      PRIORITY_FEE_PERCENTILE: ${PRIORITY_FEE_PERCENTILE:-}
      PRIORITY_FEE_MIN_MICRO_LAMPORTS: ${PRIORITY_FEE_MIN_MICRO_LAMPORTS:-}
    expose:
      - "3000"

  # The canonical check. It may run while the bot runs: it works in its own database
  # ``meteora_check`` on the same postgres (created when missing, then migrated and handed to
  # the tests), so it writes nothing into ``meteora`` and never contends with the worker for
  # its leases. Nothing needs cleaning in the working database afterwards.
  check:
    <<: *python-service
    profiles: ["test"]
    environment:
      <<: *python-environment
      DATABASE_URL: &check-database postgresql+asyncpg://meteora@postgres:5432/meteora_check
      TEST_DATABASE_URL: *check-database
    command:
      - sh
      - -ec
      - |
        umask 077
        uv run python -m tests.check_database
        printf '%s' "$${DATABASE_URL}" > /tmp/database-url
        export DATABASE_URL_FILE=/tmp/database-url
        unset DATABASE_URL
        uv run alembic upgrade head
        uv run alembic upgrade head
        uv run ruff check src tests migrations
        uv run mypy src
        uv run pytest -q -p no:cacheprovider --basetemp /tmp/pytest
        npm run check --prefix executor
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
